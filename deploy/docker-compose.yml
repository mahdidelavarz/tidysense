name: tidysense

x-logging: &logging
  driver: ${LOG_DRIVER:-journald}

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  image: tidysense-backend
  environment:
    # اتصال به دیتابیس مرکزی
    ConnectionStrings__DefaultConnection: Host=main-postgres;Database=tidysense;Username=tidysense;Password=${POSTGRES_PASSWORD:?}
    Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
    Otp__HashingKey: ${OTP_HASHING_KEY:?}
    Kavenegar__ApiKey: ${KAVENEGAR_API_KEY:?}
    Kavenegar__Template: ${KAVENEGAR_VERIFY_TEMPLATE:?}
    Kavenegar__Sender: ${KAVENEGAR_SENDER:-}
    AllowedHosts: ${SITE_HOST:?}
    Security__AllowedOrigins__0: https://${SITE_HOST:?}
    Security__KnownProxies__0: 172.30.0.10
    Ai__Planning__Provider: ${AI_PLANNING_PROVIDER:-mock}
    Ai__Reconcile__Provider: ${AI_RECONCILE_PROVIDER:-mock}
    Ai__Providers__deepseek__ApiKey: ${DEEPSEEK_API_KEY:-}
    Operations__OperatorPhones__0: ${OPERATOR_PHONE:?}
    Operations__InternalPhones__0: ${INTERNAL_PHONE:-}
    Operations__AlertDigest__Enabled: "true"
    Operations__AlertDigest__To: ${ALERT_EMAIL_TO:?}
    Operations__AlertDigest__From: ${ALERT_EMAIL_FROM:?}
    Operations__AlertDigest__SmtpHost: ${SMTP_HOST:?}
    Operations__AlertDigest__SmtpPort: ${SMTP_PORT:-587}
    Operations__AlertDigest__SmtpUser: ${SMTP_USER:-}
    Operations__AlertDigest__SmtpPassword: ${SMTP_PASSWORD:-}
    Pilot__SupportContact: ${SUPPORT_CONTACT:?}
  networks:
    - internal
    - shared-network # اتصال به شبکه دیتابیس
  logging: *logging

services:
  # کانتینر دیتابیس داخلی حذف شد

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    # وابستگی به db داخلی حذف شد، زیرا main-postgres از قبل روشن است

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: tidysense-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_HOST:?}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      internal:
        ipv4_address: 172.30.0.10
    logging: *logging

  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      # اتصال کانتینر بکاپ‌گیر به دیتابیس مرکزی
      PGHOST: main-postgres
      PGDATABASE: tidysense
      PGUSER: tidysense
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    networks:
      - internal
      - shared-network # دسترسی به دیتابیس مرکزی
    logging: *logging

volumes:
  backups:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  shared-network:
    external: true