<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" />
    <script>
      // Sets the theme before first paint; shared/lib/theme.ts keeps it afterwards.
      ;(() => {
        try {
          let t = localStorage.getItem('tidysense.theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1720')
        } catch {}
      })()
    </script>
    <title>تایدی‌سنس</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
